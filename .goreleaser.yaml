# GoReleaser config — https://goreleaser.com
# Build & validate locally with:  goreleaser release --snapshot --clean
# Cross-compiles cleanly because every dependency is pure Go (CGO disabled).
version: 2

project_name: geiger

before:
  hooks:
    - go mod download

builds:
  - id: geiger
    main: ./cmd/geiger
    binary: geiger
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    # 64-bit only, on the three platforms people actually run this from. The
    # dropped targets (linux/386, linux/armv7, windows/386, freebsd/*) each sat
    # at 2-3 downloads across all releases — indistinguishable from scanners —
    # while accounting for five of the eleven builds. Add a goos/goarch back if
    # someone asks for one.
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: geiger
    # Matches the geiger_<version>_<os>_<arch>.tar.gz names in the README.
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
